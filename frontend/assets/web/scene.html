<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sky Haven 3D</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
    <script>
        let scene, camera, renderer, controls, loader;
        let islandMesh = null;
        const raycastObjects = []; 
        let placedItems = [];
        let modelCache = {}; // Cache to prevent GPU out-of-memory
        
        let activeGhost = null;
        let pointerDownPos = new THREE.Vector2();
        let isDragging = false;

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB); 
            scene.fog = new THREE.FogExp2(0x87CEEB, 0.002);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(15, 10, 15);

            // AGGRESSIVE GPU OPTIMIZATION FOR MOBILE
            // 1. Disable antialiasing (saves MSAA buffer memory)
            // 2. Set powerPreference to low-power
            // 3. Force 1.0 pixel ratio (prevents 4x memory usage on high-DPI screens)
            renderer = new THREE.WebGLRenderer({ antialias: false, alpha: false, powerPreference: "low-power" });
            renderer.setPixelRatio(1.0);
            renderer.setSize(window.innerWidth, window.innerHeight);
            
            // 4. Disable shadow maps completely to prevent gles_texture_egl_image_get_2d BAD ALLOC
            renderer.shadowMap.enabled = false;
            
            document.body.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 + 0.1; 

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
            dirLight.position.set(20, 40, 20);
            scene.add(dirLight);

            loader = new THREE.GLTFLoader();

            if (window.FlutterChannel) {
                window.FlutterChannel.postMessage(JSON.stringify({ type: 'ready' }));
            }

            window.addEventListener('resize', onWindowResize, false);
            setupInteraction();
            animate();
        }

        function loadIsland(base64Data) {
            console.log("Loading island...");
            loader.load(base64Data, function(gltf) {
                if (islandMesh) {
                    scene.remove(islandMesh);
                    const index = raycastObjects.indexOf(islandMesh);
                    if (index > -1) raycastObjects.splice(index, 1);
                }
                islandMesh = gltf.scene;
                islandMesh.scale.set(1, 1, 1);
                
                islandMesh.traverse(function(node) {
                    if (node.isMesh) {
                        node.castShadow = true;
                        node.receiveShadow = true;
                    }
                });
                scene.add(islandMesh);
                raycastObjects.push(islandMesh); 
            });
        }

        function clearObjects() {
            placedItems.forEach(item => {
                scene.remove(item);
            });
            placedItems = [];
        }

        function loadObject(id, assetKey, base64Data, x, z) {
            if (modelCache[assetKey]) {
                if (modelCache[assetKey] === "loading") {
                    setTimeout(() => loadObject(id, assetKey, base64Data, x, z), 200);
                } else {
                    _spawnFromCache(id, assetKey, x, z);
                }
            } else {
                modelCache[assetKey] = "loading";
                loader.load(base64Data, function(gltf) {
                    modelCache[assetKey] = gltf.scene;
                    _spawnFromCache(id, assetKey, x, z);
                });
            }
        }

        function _spawnFromCache(id, assetKey, x, z) {
            const obj = modelCache[assetKey].clone();
            const y = getTerrainHeight(x, z);
            obj.position.set(x, y, z);
            obj.userData = { id: id };
            
            obj.traverse(function(node) {
                if (node.isMesh) {
                    node.castShadow = true;
                    node.receiveShadow = true;
                }
            });
            scene.add(obj);
            placedItems.push(obj);
        }

        function setPlacementGhost(assetKey, base64Data) {
            clearPlacementGhost();
            if (modelCache[assetKey]) {
                if (modelCache[assetKey] === "loading") {
                    setTimeout(() => setPlacementGhost(assetKey, base64Data), 200);
                } else {
                    _createGhost(assetKey);
                }
            } else {
                modelCache[assetKey] = "loading";
                loader.load(base64Data, function(gltf) {
                    modelCache[assetKey] = gltf.scene;
                    _createGhost(assetKey);
                });
            }
        }

        function _createGhost(assetKey) {
            activeGhost = modelCache[assetKey].clone();
            activeGhost.traverse(function(node) {
                if (node.isMesh && node.material) {
                    node.material = node.material.clone();
                    node.material.transparent = true;
                    node.material.opacity = 0.7;
                    node.material.color.setHex(0xaaffaa); 
                }
            });
            const y = getTerrainHeight(0, 0);
            activeGhost.position.set(0, y, 0);
            scene.add(activeGhost);
        }

        function clearPlacementGhost() {
            if (activeGhost) {
                scene.remove(activeGhost);
                activeGhost = null;
            }
        }

        function getTerrainHeight(x, z) {
            if (!islandMesh) return 0;
            const raycaster = new THREE.Raycaster();
            const origin = new THREE.Vector3(x, 100, z);
            const direction = new THREE.Vector3(0, -1, 0);
            raycaster.set(origin, direction);
            const intersects = raycaster.intersectObject(islandMesh, true);
            if (intersects.length > 0) {
                return intersects[0].point.y;
            }
            return 0;
        }

        function setupInteraction() {
            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();
            
            renderer.domElement.addEventListener('pointerdown', (event) => {
                isDragging = false;
                pointerDownPos.x = event.clientX;
                pointerDownPos.y = event.clientY;
            });

            renderer.domElement.addEventListener('pointermove', (event) => {
                if (Math.abs(event.clientX - pointerDownPos.x) > 5 || 
                    Math.abs(event.clientY - pointerDownPos.y) > 5) {
                    isDragging = true;
                }
            });
            
            renderer.domElement.addEventListener('pointerup', (event) => {
                if (isDragging) return; 
                if (event.button !== 0 && event.pointerType === 'mouse') return;
                
                mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
                
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(raycastObjects, true);
                
                if (intersects.length > 0) {
                    const pt = intersects[0].point;
                    if (activeGhost) {
                        activeGhost.position.set(pt.x, pt.y, pt.z);
                        if (window.FlutterChannel) {
                            window.FlutterChannel.postMessage(JSON.stringify({ 
                                type: 'placement_update', x: pt.x, y: pt.y, z: pt.z 
                            }));
                        }
                    } else {
                        if (window.FlutterChannel) {
                            window.FlutterChannel.postMessage(JSON.stringify({ 
                                type: 'tap', x: pt.x, y: pt.y, z: pt.z 
                            }));
                        }
                    }
                }
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        window.SkyHaven = {
            loadIsland: loadIsland,
            loadObject: loadObject,
            clearObjects: clearObjects,
            setPlacementGhost: setPlacementGhost,
            clearPlacementGhost: clearPlacementGhost,
            setCamera: function(x, y, z) {
                camera.position.set(x, y, z);
            }
        };

        window.onload = init;
    </script>
</body>
</html>
